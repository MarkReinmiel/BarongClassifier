<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New device | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=3">
</head>
<body>
  <div class="auth-shell">
    <section class="auth-card">
      <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/Barongclassi_logo.jpeg') }}" alt="BarongClassifier logo">
        <span>BARONG CLASSIFIER</span>
      </div>
      <p class="eyebrow">New device detected</p>
      <h1>Confirm this browser</h1>
      <p class="lead sm">We emailed a 6-digit code to <strong>{{ email_hint }}</strong>. Codes expire in 24 hours.</p>
      <div class="otp" id="otp" data-purpose="device" data-resend="{{ resend_after_seconds }}" role="group" aria-label="Six-digit verification code">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
      </div>
      <p class="status" id="verifyStatus" role="status"></p>
      <div class="auth-actions">
        <button class="btn p" type="button" id="verifyBtn" style="width:100%">Verify Device</button>
        <button type="button" class="resend" id="resendBtn" disabled>Resend code in 00:60</button>
        <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
      </div>
    </section>
  </div>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=2"></script>
</body>
</html>
