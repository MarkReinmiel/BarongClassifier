<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-shell">
    <section class="auth-card">
      <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/Barongclassi_logo.jpeg') }}" alt="">
        <span>BARONG CLASSIFIER</span>
      </div>
      <p class="eyebrow">Create account</p>
      <h1>Sign up</h1>
      <p class="lead sm">We will email a 6-digit code. It expires in 24 hours.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}" style="margin-bottom:12px">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post" class="stack" id="registerForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label><span class="lbl">Email</span><input class="field" type="email" name="email" value="{{ email or request.form.email or '' }}" required autocomplete="email"></label>
        <label><span class="lbl">Password</span>
          <span class="pw-wrap">
            <input class="field" type="password" name="password" id="regPassword" required minlength="12" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="regPassword">Show</button>
          </span>
        </label>
        <label><span class="lbl">Confirm password</span>
          <span class="pw-wrap">
            <input class="field" type="password" name="confirm_password" id="regConfirm" required minlength="12" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-target="regConfirm">Show</button>
          </span>
        </label>
        <button class="btn p" type="submit" id="registerBtn">Create Account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </section>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
