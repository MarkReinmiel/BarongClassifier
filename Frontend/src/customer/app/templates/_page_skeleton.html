{# Dashboard-shaped skeleton (login / Google arrival) #}
<div class="page-skel" id="{{ skel_id|default('pageSkeleton') }}" aria-hidden="true" {% if skel_hidden|default(false) %}hidden{% endif %}>
  <div class="page-skel-top">
    <span class="page-skel-brand"></span>
    <div class="page-skel-top-links">
      <span class="page-skel-top-link"></span>
      <span class="page-skel-top-link"></span>
      <span class="page-skel-top-link"></span>
      <span class="page-skel-top-link"></span>
    </div>
    <span class="page-skel-avatar"></span>
  </div>

  <div class="page-skel-dash">
    <section class="page-skel-hero">
      <div class="page-skel-hero-copy">
        <span class="page-skel-line page-skel-line--label"></span>
        <span class="page-skel-line page-skel-line--title"></span>
        <span class="page-skel-line page-skel-line--sub"></span>
        <span class="page-skel-pill"></span>
      </div>
      <span class="page-skel-hero-media"></span>
    </section>

    <section class="page-skel-overview">
      <span class="page-skel-overview-card"></span>
      <span class="page-skel-overview-card"></span>
    </section>

    <section class="page-skel-tools">
      <span class="page-skel-line page-skel-line--section"></span>
      <div class="page-skel-tools-grid">
        <span class="page-skel-tool"></span>
        <span class="page-skel-tool"></span>
        <span class="page-skel-tool"></span>
      </div>
    </section>

    <section class="page-skel-lower">
      <div class="page-skel-panel">
        <span class="page-skel-line page-skel-line--section"></span>
        <div class="page-skel-steps">
          <span class="page-skel-step"></span>
          <span class="page-skel-step"></span>
          <span class="page-skel-step"></span>
          <span class="page-skel-step"></span>
        </div>
      </div>
      <div class="page-skel-panel">
        <span class="page-skel-line page-skel-line--section"></span>
        <div class="page-skel-rows">
          <div class="page-skel-row">
            <span class="page-skel-thumb"></span>
            <div class="page-skel-row-copy">
              <span class="page-skel-line"></span>
              <span class="page-skel-line page-skel-line--short"></span>
            </div>
          </div>
          <div class="page-skel-row">
            <span class="page-skel-thumb"></span>
            <div class="page-skel-row-copy">
              <span class="page-skel-line"></span>
              <span class="page-skel-line page-skel-line--short"></span>
            </div>
          </div>
          <div class="page-skel-row">
            <span class="page-skel-thumb"></span>
            <div class="page-skel-row-copy">
              <span class="page-skel-line"></span>
              <span class="page-skel-line page-skel-line--short"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  {# Mobile bottom nav skeleton only #}
  <nav class="page-skel-bottom-nav" aria-hidden="true">
    <span class="page-skel-nb">
      <span class="page-skel-nb-icon"></span>
      <span class="page-skel-nb-label"></span>
    </span>
    <span class="page-skel-nb">
      <span class="page-skel-nb-icon"></span>
      <span class="page-skel-nb-label"></span>
    </span>
    <span class="page-skel-nb">
      <span class="page-skel-nb-icon"></span>
      <span class="page-skel-nb-label"></span>
    </span>
    <span class="page-skel-nb">
      <span class="page-skel-nb-icon"></span>
      <span class="page-skel-nb-label"></span>
    </span>
  </nav>
</div>
