<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=40">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=51">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-ui.css') }}?v=15">
</head>
<body class="auth-body auth-body--home">
  <a class="auth-back" href="{{ url_for('auth.login') }}"><span class="auth-back-arrow" aria-hidden="true"></span> Sign in</a>

  <div class="auth-split auth-split--open">
    <section class="auth-split-brand" aria-label="Barongcognition">
      <div class="auth-logo auth-logo--hero">
        <img src="{{ url_for('static', filename='images/barongcognition_logo.png') }}" alt="Barongcognition logo">
        <span>Barongcognition</span>
      </div>
      <p class="auth-kicker">New password</p>
      <h1 class="auth-title">Preserving heritage, one textile at a time.</h1>
      <p class="auth-subtitle">Use at least 12 characters. You will sign in again after the update.</p>
      <figure class="auth-hero-media auth-hero-media--frame">
        <span class="frame-corner frame-tl" aria-hidden="true"></span>
        <span class="frame-corner frame-tr" aria-hidden="true"></span>
        <span class="frame-corner frame-bl" aria-hidden="true"></span>
        <span class="frame-corner frame-br" aria-hidden="true"></span>
        <img
          src="{{ url_for('static', filename='images/barong.jpg') }}"
          alt="Close-up of embroidered Barong Tagalog textile"
          loading="eager"
        >
      </figure>
    </section>

    <div class="auth-split-form">
      <section class="auth-card auth-card--panel" aria-label="Reset password">
        <h2 class="auth-card-heading">Reset password</h2>
        <p class="lead sm">Create a new password for your Customer account.</p>
        {% if error %}<div class="flash error" style="margin-bottom:12px">{{ error }}</div>{% endif %}
        <form method="post" class="stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label>
            <span class="lbl">New password</span>
            <span class="pw-wrap">
              <input class="field" type="password" name="password" id="newPassword" required minlength="12" autocomplete="new-password" placeholder="Create a new password">
              <button type="button" class="pw-toggle" data-target="newPassword">Show</button>
            </span>
            <div class="strength" id="strengthMeter"><span></span></div>
            <p class="reqs">Strength: <span id="strengthLabel">Weak</span></p>
          </label>
          <label>
            <span class="lbl">Confirm password</span>
            <span class="pw-wrap">
              <input class="field" type="password" name="confirm" id="confirmPassword" required minlength="12" autocomplete="new-password" placeholder="Confirm password">
              <button type="button" class="pw-toggle" data-target="confirmPassword">Show</button>
            </span>
          </label>
          <button class="btn p auth-submit" type="submit">Update password</button>
        </form>
        <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Return to sign in</a></p>
      </section>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=15"></script>
  <script src="{{ url_for('static', filename='js/password.js') }}?v=1"></script>
</body>
</html>
