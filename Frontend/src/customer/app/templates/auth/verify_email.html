<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email | {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=20">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=20">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/motion.css') }}?v=8">
</head>
<body>
  <div class="auth-shell">
    <section class="auth-card">
      <div class="auth-logo">
        <img src="{{ url_for('static', filename='images/barongcognition_logo.png') }}" alt="BarongClassifier logo">
        <span>Barongcognition</span>
      </div>
      <p class="eyebrow">Email verification</p>
      <h1>Enter your code</h1>
      <p class="lead sm">A 6-digit code was sent to <strong id="emailHint">{{ email_hint }}</strong>. Codes expire in 24 hours.</p>
      <div class="otp" id="otp" data-purpose="registration" data-resend="{{ resend_after_seconds }}" role="group" aria-label="Six-digit verification code">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
      </div>
      <p class="status" id="verifyStatus" role="status"></p>
      <div class="auth-actions">
        <button class="btn p" type="button" id="verifyBtn" style="width:100%">Verify Email</button>
        <button type="button" class="resend" id="resendBtn" disabled>Resend code in 00:60</button>
        <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
      </div>
    </section>
  </div>
  <div class="modal-backdrop" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="modal">
      <div class="check" aria-hidden="true">✓</div>
      <h2 id="successTitle">Account verified</h2>
      <p class="sm" style="margin:8px 0 16px">Your email was verified successfully. Sign in to continue.</p>
      <a class="btn p" href="{{ url_for('auth.login') }}" style="width:100%">Go to Login</a>
    </div>
  </div>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="{{ url_for('static', filename='js/motion.js') }}?v=8"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=16"></script>
</body>
</html>
