<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/page-skeleton.css') }}?v=2">
  <style>
    html, body { margin: 0; min-height: 100%; background: #c2baa4; }
    .google-error {
      position: relative;
      z-index: 130;
      min-height: 100vh;
      display: none;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-family: "DM Sans", Arial, sans-serif;
      color: #1f2232;
      background: #c2baa4;
    }
    .google-error.is-visible { display: grid; }
    .google-error p { margin: 8px 0 0; color: #596475; }
    .google-error a { color: #c84630; font-weight: 600; }
  </style>
</head>
<body>
  {% include "_page_skeleton.html" %}

  <div class="google-error" id="googleErrorPanel" hidden>
    <div>
      <h2>Sign-in did not finish</h2>
      <p id="googleError"></p>
      <p style="margin-top:16px"><a id="googleBack" href="{{ login_url|default('/auth/login') }}">Back to sign in</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    var panel = document.getElementById("googleErrorPanel");
    var errorEl = document.getElementById("googleError");
    var backEl = document.getElementById("googleBack");
    var skel = document.getElementById("pageSkeleton");
    var completeUrl = {{ (complete_url or "/auth/google/complete")|tojson }};
    var loginUrl = {{ (login_url or "/auth/login")|tojson }};
    var registerUrl = {{ (register_url or "/auth/register")|tojson }};
    var intent = {{ (intent or "login")|tojson }};
    var csrf = {{ (csrf_token or "")|tojson }};
    var supabaseUrl = {{ (supabase_url or "")|tojson }};
    var supabaseKey = {{ (supabase_anon_key or "")|tojson }};

    function fail(message, redirectTo) {
      if (skel) skel.hidden = true;
      if (redirectTo) {
        window.location.replace(redirectTo);
        return;
      }
      if (panel) {
        panel.hidden = false;
        panel.classList.add("is-visible");
      }
      if (errorEl) errorEl.textContent = message || "Please try again.";
      if (backEl) {
        backEl.href = loginUrl || registerUrl;
        backEl.textContent = "Back to sign in";
      }
    }

    function finish(accessToken) {
      return fetch(completeUrl, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrf,
        },
        body: JSON.stringify({
          access_token: accessToken,
          remember: true,
          intent: intent || "login",
        }),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.data || !result.data.ok) {
            fail(
              (result.data && result.data.error) || "Google sign-in failed.",
              (result.data && result.data.redirect) || loginUrl
            );
            return;
          }
          window.location.replace(result.data.redirect || "/dashboard");
        })
        .catch(function () {
          fail("Network error while completing Google sign-in.", loginUrl);
        });
    }

    function tokenFromLocation() {
      var hash = window.location.hash ? window.location.hash.slice(1) : "";
      var query = window.location.search ? window.location.search.slice(1) : "";
      var params = new URLSearchParams(hash || query);
      return {
        accessToken: params.get("access_token"),
        code: params.get("code"),
        error: params.get("error_description") || params.get("error"),
      };
    }

    var loc = tokenFromLocation();
    if (loc.error) {
      window.location.replace(loginUrl);
      return;
    }

    if (!window.supabase || !supabaseUrl || !supabaseKey) {
      fail("Google sign-in is missing configuration.", loginUrl);
      return;
    }

    var client = window.supabase.createClient(supabaseUrl, supabaseKey, {
      auth: { detectSessionInUrl: true, persistSession: true },
    });

    var chain = Promise.resolve();
    if (loc.code) {
      chain = client.auth.exchangeCodeForSession(loc.code);
    }

    chain
      .then(function () {
        return client.auth.getSession();
      })
      .then(function (result) {
        var session = result && result.data && result.data.session;
        if (session && session.access_token) {
          return finish(session.access_token);
        }
        if (loc.accessToken) {
          return finish(loc.accessToken);
        }
        fail("No Google session was returned.", loginUrl);
      })
      .catch(function () {
        fail("Could not read the Google session.", loginUrl);
      });
  })();
  </script>
</body>
</html>
