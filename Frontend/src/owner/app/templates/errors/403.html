{% extends "base.html" %}
{% block title %}Forbidden{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}
{% block body %}
<main class="auth-page">
  <section class="auth-card" style="text-align:center">
    <p class="form-label">ACCESS DENIED</p>
    <h2>403</h2>
    <p class="form-description">You are not authorized to open the Owner Portal.</p>
    <a class="auth-button" href="{{ url_for('auth.login') }}">Sign in</a>
  </section>
</main>
{% endblock %}
