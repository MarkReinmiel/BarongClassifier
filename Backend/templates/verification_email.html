<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Georgia,serif;color:#2F323A;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f1ea;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px 28px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;letter-spacing:0.08em;font-size:13px;">{{app_name}}</p>
              <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;">Verify your email</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">Use this code to finish creating your account. It expires in {{expires_in}}.</p>
              <p style="margin:0 0 20px;font-size:32px;letter-spacing:8px;font-weight:700;">{{code}}</p>
              <p style="margin:0 0 8px;font-size:14px;line-height:1.5;">Do not share this code with anyone.</p>
              <p style="margin:0;font-size:14px;line-height:1.5;">If you did not request this email, you can ignore it. Your address was used on the BarongClassifier signup form.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
